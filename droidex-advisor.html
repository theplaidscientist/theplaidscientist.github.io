<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Droidex Advisor</title>
<meta name="description" content="Pick two droids and their tier, and Droidex Advisor points to the better chip investment — ranked by CPS gained per chip, not sticker price." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#070a10; --bg-1:#0d131b; --bg-2:#121a24; --surface:#141d29; --surface-2:#0f1620;
    --line:#233042; --line-soft:#1a2432;
    --text-primary:#eef3f8; --text-secondary:#9fb0c2; --text-muted:#5f7086;
    --reset-now:#2fc3de; --grind:#e0912f; --crystal:#b79bf5;
    --good:#0ca30c; --warn:#fab219; --warn-bg:rgba(250,178,25,.12);
    --font-display:'Bebas Neue', 'Rajdhani', sans-serif;
    --font-mono:'Share Tech Mono', monospace;
    --font-body:'Rajdhani', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 1200px 600px at 20% -10%, rgba(47,195,222,.08), transparent 60%),
      radial-gradient(ellipse 1000px 700px at 100% 10%, rgba(224,145,47,.07), transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
    color:var(--text-primary); font-family:var(--font-body); min-height:100vh; padding:24px 18px 50px;
  }
  .wrap{max-width:840px;margin:0 auto;}
  .badge-strip{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--text-muted);margin-bottom:14px;text-transform:uppercase;}
  .badge-strip .dot{width:5px;height:5px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good);}
  .hero-mini{text-align:center;padding:4px 0 22px;}
  h1.title-mini{font-family:var(--font-display);font-size:clamp(30px,6vw,48px);letter-spacing:.03em;margin:0;
    background:linear-gradient(95deg, var(--reset-now) 0%, #eef3f8 40%, #eef3f8 60%, var(--grind) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}

  /* ---------- head-to-head compare ---------- */
  .compare-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start;margin-bottom:16px;}
  @media (max-width:620px){.compare-grid{grid-template-columns:1fr;}
    .compare-arrow{flex-direction:row;justify-content:center;padding:6px 0;}
    .compare-arrow .arrow-icon{transform:rotate(90deg) !important;}
  }
  .compare-side{background:linear-gradient(160deg, var(--surface), var(--surface-2));border:1px solid var(--line);
    clip-path:polygon(0 10px,10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
    padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .compare-side.winner{border-color:var(--reset-now);box-shadow:0 0 0 1px var(--reset-now), 0 0 18px rgba(47,195,222,.2);}
  .compare-visual{color:var(--text-muted);}
  .compare-visual.rare{color:var(--reset-now);} .compare-visual.epic{color:var(--grind);}
  .compare-visual.legendary{color:var(--crystal);} .compare-visual.mythic{color:var(--warn);}
  .compare-side select{width:100%;font-family:var(--font-mono);font-size:13px;padding:9px 10px;border-radius:2px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-primary);}
  .compare-side select:focus{outline:none;border-color:var(--reset-now);}
  .tag{display:inline-block;font-family:var(--font-mono);font-size:9.5px;padding:2px 6px;border-radius:2px;text-transform:uppercase;border:1px solid transparent;}
  .tag.common{background:rgba(159,176,194,.12);color:var(--text-secondary);border-color:var(--line);}
  .tag.rare{background:rgba(47,195,222,.14);color:var(--reset-now);border-color:rgba(47,195,222,.3);}
  .tag.epic{background:rgba(224,145,47,.14);color:var(--grind);border-color:rgba(224,145,47,.3);}
  .tag.legendary{background:rgba(183,155,245,.14);color:var(--crystal);border-color:rgba(183,155,245,.3);}
  .tag.mythic{background:var(--warn-bg);color:var(--warn);border-color:rgba(250,178,25,.35);}
  .compare-stat{font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary);border-top:1px dashed var(--line-soft);padding-top:8px;margin-top:2px;width:100%;}
  .compare-stat b{color:var(--text-primary);}
  .compare-stat .eff{color:var(--reset-now);font-weight:bold;}
  .compare-stat .gain{color:var(--good);}
  .compare-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-top:60px;min-width:64px;}
  .arrow-icon{font-size:40px;line-height:1;color:var(--line-soft);transition:color .2s, transform .2s;}
  .arrow-icon.left{transform:scaleX(-1);}
  .arrow-icon.active{color:var(--reset-now);text-shadow:0 0 16px rgba(47,195,222,.5);}
  .arrow-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);text-align:center;max-width:90px;}
  .arrow-label b{color:var(--reset-now);}

  footer{text-align:center;margin-top:22px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);line-height:1.7;}
  footer a{color:var(--text-secondary);}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge-strip"><span class="dot"></span> DROID TYCOON // UNOFFICIAL FAN TOOL</div>
  <header class="hero-mini"><h1 class="title-mini">DROIDEX ADVISOR</h1></header>

  <div class="compare-grid">
    <div class="compare-side" id="sideA"></div>
    <div class="compare-arrow" id="arrowBox">
      <div class="arrow-icon left" id="arrowIcon">➜</div>
      <div class="arrow-label" id="arrowLabel">Pick a droid on each side</div>
    </div>
    <div class="compare-side" id="sideB"></div>
  </div>

  <footer>
    Fan-made, unofficial — not affiliated with Epic Games, Lucasfilm, or Disney. Values are community-sourced.<br>
    <a href="https://tycoon-tools.com/droid-tycoon/value-list/" target="_blank">CPS value list source</a> ·
    <a href="https://insider-gaming.com/fortnite-star-wars-droid-tycoon-upgrade-droids/" target="_blank">Upgrade costs source</a>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var TIERS = ["Tier", "Gold", "Diamond", "Rainbow", "Beskar", "Galactic"];
  var RARITY_TAG = { Common: "common", Rare: "rare", Epic: "epic", Legendary: "legendary", Mythic: "mythic" };

  // Chip cost to reach each tier from the previous one, by rarity. Confirmed table.
  var DEFAULT_COSTS = {
    Common:    { 1: 10,  2: 25,   3: 40,   4: 80,   5: 120   },
    Rare:      { 1: 30,  2: 60,   3: 100,  4: 250,  5: 400   },
    Epic:      { 1: 120, 2: 180,  3: 240,  4: 3000, 5: 6000  },
    Legendary: { 1: 400, 2: 1200, 3: 3000, 4: 7500, 5: 20000 },
    Mythic:    { 1: 4000, 2: 8000, 3: 20000, 4: 40000, 5: 70000 }
  };

  // Iconic droids (BB-8, Mister Bones, IG-11 Marshal, DJ-R3X, CB-23, R2-D2, C-3PO, C1-10P/Chopper,
  // and soon D-0) cannot be upgraded at all, so they're intentionally excluded from this list.
  //
  // CPS is stored per-droid as the exact value at each of the 6 tiers (not derived from a formula).
  // Earlier versions assumed CPS simply doubles every tier — real per-tier growth turns out to be
  // uneven and rarity-dependent (Common/Rare: x2,x2,x2,x1.5,x2 — Epic: x2,x2,x2,~x4.25,~x1.53 —
  // Legendary: x2,x2,x2,~x3,~x2.5 — Mythic: x2,x2,x2,x2,~x2.75), confirmed against real in-game
  // screenshots at Beskar tier. So each tier's CPS is listed explicitly below: [Tier, Gold, Diamond, Rainbow, Beskar, Galactic].
  var DROIDEX = [
    ["Mouse","Common",[2,4,8,16,24,48]],["Pit","Common",[2,4,8,16,24,48]],
    ["Gonk","Common",[4,8,16,32,48,96]],["R8","Common",[4,8,16,32,48,96]],
    ["ID10","Common",[4,8,16,32,48,96]],
    ["CB","Common",[3,6,12,24,36,72]],["R3","Common",[3,6,12,24,36,72]],
    ["R5","Common",[3,6,12,24,36,72]],["DRK-1 Probe","Common",[3,6,12,24,36,72]],
    ["B1 Battle","Common",[5,10,20,40,60,120]],["Imperial Probe","Common",[6,12,24,48,72,144]],

    ["BDX Explorer","Rare",[15,30,60,120,180,360]],["2BB","Rare",[17,34,68,136,204,408]],
    ["Bal-Core","Rare",[23,46,92,184,276,552]],["VECT-Arm","Rare",[27,54,108,216,324,648]],
    ["ROLL-R","Rare",[31,62,124,248,372,744]],["A-LT","Rare",[36,72,144,288,432,864]],
    ["ARG","Rare",[42,84,168,336,504,1000]],["Senate Hovercam","Rare",[46,92,184,368,552,1100]],
    ["R4","Rare",[50,100,200,400,600,1200]],["R9","Rare",[54,108,216,432,648,1300]],
    ["BU-4D","Rare",[58,116,232,464,696,1400]],["HOV-R","Rare",[62,124,248,496,744,1500]],
    ["B1 Security","Rare",[66,132,264,528,792,1600]],["NAV-EX","Rare",[18,36,72,144,216,432]],

    ["Groundmech","Epic",[120,240,480,960,4100,6200]],["BB","Epic",[150,300,600,1200,5100,7800]],
    ["ORB-Walker","Epic",[180,360,720,1400,6100,9400]],["Util-Tec","Epic",[210,420,840,1700,7100,10900]],
    ["LO","Epic",[240,480,960,1900,8200,12500]],["Haul-R","Epic",[270,540,1100,2200,9200,14000]],
    ["R6","Epic",[300,600,1200,2400,10200,15600]],["TRAK-R","Epic",[330,660,1300,2600,11200,17200]],
    ["R2","Epic",[360,720,1400,2900,12200,18700]],["Opti-Pod","Epic",[390,780,1600,3100,13300,20300]],
    ["B2 Super","Epic",[420,840,1700,3400,14300,21800]],["LNG-Shot","Epic",[450,900,1800,3600,15300,23400]],
    ["B2 Heavy","Epic",[480,960,1900,3800,16300,25000]],["SEN-TRI","Epic",[510,1000,2000,4100,17300,26500]],
    ["Strike-Orb","Epic",[540,1100,2200,4300,18400,28100]],["AMP Walker","Epic",[570,1100,2300,4600,19400,29600]],
    ["B1 Heavy","Epic",[630,1300,2500,4800,20400,31200]],["Gunrunner","Epic",[660,1300,2600,5300,22400,34300]],

    ["Proto-Roller","Legendary",[972,1900,3900,7800,23300,58300]],
    ["Mecha-Droid","Legendary",[1200,2500,5000,9900,29900,74600]],
    ["Cyclo-Grav","Legendary",[1300,2500,5000,10100,30200,75600]],
    ["BB9","Legendary",[1300,2600,5200,10400,31200,78000]],
    ["B2-RP","Legendary",[1300,2600,5200,10400,31300,78200]],
    ["Mono-WLKR","Legendary",[1500,3000,6000,12000,36000,90000]],
    ["R7","Legendary",[1500,3000,6000,12000,36000,90000]],
    ["Opti-STRK","Legendary",[1500,3000,6000,12000,36000,90000]],

    ["Cyclens","Mythic",[4400,8800,17600,35200,70400,193600]],
    ["Snow Mouse","Mythic",[4400,8800,17600,35200,70400,193600]],
    ["Ric","Mythic",[5100,10200,20400,40800,81600,224400]],
    ["Drft-R","Mythic",[5800,11600,23200,46400,92800,255200]],
    ["IG","Mythic",[5800,11600,23200,46400,92800,255200]],
    ["Ric-1200","Mythic",[5800,11600,23200,46400,92800,255200]],
    ["Lep","Mythic",[6500,13000,26000,52000,104000,286000]],
    ["Tri-Tek","Mythic",[6500,13000,26000,52000,104000,286000]],
    ["Loadlifter","Mythic",[7200,14400,28800,57600,115200,316800]],
    ["Mo-Trak","Mythic",[7200,14400,28800,57600,115200,316800]],
    ["KX","Mythic",[7200,14400,28800,57600,115200,316800]]
  ].map(function (r) { return { name: r[0], rarity: r[1], cps: r[2] }; });

  var costs = DEFAULT_COSTS; // internal only — not user-editable
  var slotA = { name: "", tier: 0 };
  var slotB = { name: "", tier: 0 };

  function findDroid(name) { return DROIDEX.find(function (d) { return d.name === name; }); }
  function sortedNames() { return DROIDEX.map(function (d) { return d.name; }).sort(function (a, b) { return a.localeCompare(b); }); }

  function costFor(rarity, targetTier) {
    var row = costs[rarity]; if (!row) return null;
    var v = row[targetTier];
    return (v === null || v === undefined || v === "") ? null : Number(v);
  }
  function computeSlot(slot) {
    var d = findDroid(slot.name);
    if (!d) return null;
    var curCps = d.cps[slot.tier];
    var maxed = slot.tier >= TIERS.length - 1;
    var nextTier = maxed ? null : slot.tier + 1;
    var nextCps = maxed ? null : d.cps[nextTier];
    var gain = (nextCps !== null && curCps !== null) ? (nextCps - curCps) : null;
    var cost = maxed ? null : costFor(d.rarity, nextTier);
    var eff = (gain !== null && cost) ? gain / cost : null;
    return { d: d, curCps: curCps, maxed: maxed, nextTier: nextTier, nextCps: nextCps, gain: gain, cost: cost, eff: eff };
  }
  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return "—";
    if (Math.abs(n) >= 1000) return (n / 1000).toFixed(n >= 10000 ? 1 : 2).replace(/\.0$/, "") + "k";
    if (Number.isInteger(n)) return String(n);
    return n.toFixed(2);
  }
  function fmtEff(n) { return (n === null || n === undefined || isNaN(n)) ? "—" : n.toFixed(2); }

  function droidIconSvg(letter) {
    return '<svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true">' +
      '<circle cx="32" cy="22" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/>' +
      '<rect x="14" y="36" width="36" height="22" rx="7" fill="none" stroke="currentColor" stroke-width="2.5"/>' +
      '<line x1="32" y1="9" x2="32" y2="3" stroke="currentColor" stroke-width="2"/>' +
      '<circle cx="32" cy="3" r="2.2" fill="currentColor"/>' +
      '<circle cx="26" cy="21" r="2.4" fill="currentColor"/>' +
      '<circle cx="38" cy="21" r="2.4" fill="currentColor"/>' +
      '<text x="32" y="51" text-anchor="middle" font-family="\'Share Tech Mono\', monospace" font-size="13" fill="currentColor">' + letter + '</text>' +
      '</svg>';
  }

  function renderSide(elId, slot, side) {
    var el = document.getElementById(elId);
    var names = sortedNames();
    var d = findDroid(slot.name);
    var tagCls = d ? (RARITY_TAG[d.rarity] || "common") : "";
    var letter = d ? d.name.trim().charAt(0).toUpperCase() : "?";
    var c = computeSlot(slot);

    var html = '<div class="compare-visual ' + tagCls + '">' + droidIconSvg(letter) + '</div>' +
      '<select class="droid-select" data-side="' + side + '">' +
        '<option value="">— pick a droid —</option>' +
        names.map(function (n) { return '<option value="' + n + '" ' + (n === slot.name ? "selected" : "") + '>' + n + '</option>'; }).join("") +
      '</select>';
    if (d) html += '<span class="tag ' + tagCls + '">' + d.rarity + '</span>';
    html += '<select class="tier-select" data-side="' + side + '">' +
        TIERS.map(function (t, i) { return '<option value="' + i + '" ' + (i === slot.tier ? "selected" : "") + '>' + t + '</option>'; }).join("") +
      '</select>';

    if (d && c) {
      var line;
      if (c.maxed) {
        line = '<b>' + fmt(c.curCps) + '</b> CPS — already maxed at ' + TIERS[slot.tier];
      } else if (c.cost === null) {
        line = '<b>' + fmt(c.curCps) + '</b> CPS now — ' + TIERS[c.nextTier] + ' chip cost not available';
      } else {
        line = '<b>' + fmt(c.curCps) + '</b> CPS now → <b>' + fmt(c.nextCps) + '</b> CPS at ' + TIERS[c.nextTier] +
          ' <span class="gain">(+' + fmt(c.gain) + ')</span>' +
          '<br>' + fmt(c.cost) + ' chips — <span class="eff">' + fmtEff(c.eff) + '/chip</span>';
      }
      html += '<div class="compare-stat">' + line + '</div>';
    }

    el.innerHTML = html;
    el.querySelector(".droid-select").addEventListener("change", function (e) { slot.name = e.target.value; renderAll(); });
    el.querySelector(".tier-select").addEventListener("change", function (e) { slot.tier = Number(e.target.value); renderAll(); });
  }

  function renderArrow() {
    var cA = computeSlot(slotA), cB = computeSlot(slotB);
    var icon = document.getElementById("arrowIcon");
    var label = document.getElementById("arrowLabel");
    var sideAEl = document.getElementById("sideA"), sideBEl = document.getElementById("sideB");
    sideAEl.classList.remove("winner"); sideBEl.classList.remove("winner");
    icon.classList.remove("active");

    if (!cA || !cB) { icon.className = "arrow-icon left"; label.textContent = "Pick a droid on each side"; return; }
    if (cA.maxed && cB.maxed) { icon.className = "arrow-icon"; label.textContent = "Both already maxed"; return; }
    if (cA.eff === null && cB.eff === null) { icon.className = "arrow-icon"; label.textContent = "Can't compare — missing cost data"; return; }
    // Only one side has a usable number — don't silently crown a winner, say why.
    if (cA.eff === null && !cA.maxed) { icon.className = "arrow-icon"; label.textContent = "Set " + cA.d.name + "'s next chip cost to compare"; return; }
    if (cB.eff === null && !cB.maxed) { icon.className = "arrow-icon"; label.textContent = "Set " + cB.d.name + "'s next chip cost to compare"; return; }

    if (cB.maxed) {
      icon.className = "arrow-icon left active"; sideAEl.classList.add("winner");
      label.innerHTML = "<b>" + cA.d.name + "</b> is the move";
      return;
    }
    if (cA.maxed) {
      icon.className = "arrow-icon active"; sideBEl.classList.add("winner");
      label.innerHTML = "<b>" + cB.d.name + "</b> is the move";
      return;
    }
    if (cA.eff === cB.eff) { icon.className = "arrow-icon"; label.textContent = "Tie — equal value"; return; }
    if (cA.eff > cB.eff) {
      icon.className = "arrow-icon left active"; sideAEl.classList.add("winner");
      label.innerHTML = "<b>" + cA.d.name + "</b> — " + fmtEff(cA.eff) + " vs " + fmtEff(cB.eff) + "/chip";
    } else {
      icon.className = "arrow-icon active"; sideBEl.classList.add("winner");
      label.innerHTML = "<b>" + cB.d.name + "</b> — " + fmtEff(cB.eff) + " vs " + fmtEff(cA.eff) + "/chip";
    }
  }

  function renderAll() {
    renderSide("sideA", slotA, "A");
    renderSide("sideB", slotB, "B");
    renderArrow();
  }

  renderAll();
})();
</script>
</body>
</html>
